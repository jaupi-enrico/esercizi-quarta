<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iscrizione ai Corsi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 600px;">

    <h2 class="mb-4">Iscrizione ai Corsi</h2>

    <form id="registrationForm">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome *</label>
        <input type="text" class="form-control" id="nome" />
      </div>

      <div class="mb-3">
        <label for="cognome" class="form-label">Cognome *</label>
        <input type="text" class="form-control" id="cognome" />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input type="email" class="form-control" id="email" />
      </div>

      <div class="mb-3">
        <label for="corso" class="form-label">Corso *</label>
        <select class="form-select" id="corso">
          <option value="">Seleziona un corso</option>
          <option>Maggio - Corso base Python</option>
          <option>Giugno - Corso base JavaScript</option>
          <option>Luglio - Corso HTML e CSS</option>
          <option>Settembre - Corso base C++</option>
          <option>Ottobre - Corso basi di database</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Modalità *</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="modalita" id="inPresenza" value="In presenza" />
          <label class="form-check-label" for="inPresenza">In presenza</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="modalita" id="online" value="Online" />
          <label class="form-check-label" for="online">Online</label>
        </div>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="newsletter" />
        <label class="form-check-label" for="newsletter">Iscrivimi alla newsletter</label>
      </div>

      <div id="errore" class="text-danger mb-3" style="display:none;"></div>

      <button type="submit" class="btn btn-primary">Iscriviti</button>

    </form>

    <hr class="my-4" id="separatore" style="display:none;">

    <div id="sezioneIscrizioni" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Iscrizioni</h5>
        <button class="btn btn-sm btn-outline-danger" id="btnEliminaTutti">Elimina tutti</button>
      </div>
      <ul class="list-group" id="listaIscrizioni"></ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
